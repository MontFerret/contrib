openapi: 3.1.0
info:
  title: Users API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: getHealth
      x-lab-mock:
        status: 200
        body:
          version: "1.0.0"
          status: "ok"
  /users:
    get:
      summary: Get list of users
      operationId: getUsers
      x-lab-mock:
        status: 200
        headers:
          content-type: application/json
        bodyTemplate: |
          [
            {{- range $i := until 5 }}
            {{- if $i }},{{ end }}
            {
              "id": {{ add $i 1 }},
              "name": "User {{ add $i 1 }}",
              "active": {{ eq (mod $i 2) 0 }}
            }
            {{- end }}
          ]
  /oauth/token:
    post:
      summary: Issue a test OAuth token
      operationId: issueOAuthToken
      x-lab-mock:
        status: 200
        headers:
          content-type: application/json
        body:
          access_token: lab-access-token
          token_type: Bearer
          expires_in: 3600
          refresh_token: lab-refresh-token
          scope: users:read

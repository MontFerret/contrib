name: Publish Module to Barn

on:
  push:
    branches:
      - main
    tags:
      - 'modules/**/v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Module release tag or full release commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: Discover module publications
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}

    steps:
      - name: Checkout publication tooling and release history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Discover release tags
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_DELETED: ${{ github.event.deleted }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            matrix="$(bash scripts/discover-publications.sh ref "$RELEASE_REF")"
          elif [[ "$EVENT_DELETED" == true ]]; then
            matrix='{"include":[]}'
          elif [[ "$EVENT_REF" == refs/tags/* ]]; then
            matrix="$(bash scripts/discover-publications.sh ref "${EVENT_REF#refs/tags/}")"
          else
            matrix="$(bash scripts/discover-publications.sh range "$BEFORE" "$AFTER")"
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  publish:
    name: Publish ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: publish-module-${{ matrix.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}

      - name: Checkout released module source
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.commit }}
          path: source
          fetch-depth: 0

      - name: Verify release tag still identifies the selected commit
        env:
          RELEASE_TAG: ${{ matrix.tag }}
          RELEASE_COMMIT: ${{ matrix.commit }}
        run: |
          actual="$(git -C source rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$actual" != "$RELEASE_COMMIT" ]]; then
            echo "Release tag changed after discovery: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create Barn GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.FERRET_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FERRET_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: barn
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Barn
        uses: actions/checkout@v6
        with:
          repository: MontFerret/barn
          ref: main
          path: barn
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: scripts/publish/go.mod
          cache: true
          cache-dependency-path: scripts/publish/go.sum

      - name: Prepare Barn registry records
        id: prepare
        env:
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          (
            cd scripts/publish
            GOWORK=off go run . \
              --source-root ../../source \
              --barn-root ../../barn \
              --tag "$RELEASE_TAG"
          )

          git -C barn add -- registry/modules
          if git -C barn diff --cached --quiet -- registry/modules; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Barn already contains this release; no PR is needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push publication branch
        if: steps.prepare.outputs.changed == 'true'
        env:
          PUBLICATION_BRANCH: publish/contrib/${{ matrix.tag }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          git -C barn check-ref-format --branch "$PUBLICATION_BRANCH"
          git -C barn config user.name "ferret-release[bot]"
          git -C barn config \
            user.email \
            "ferret-release[bot]@users.noreply.github.com"
          git -C barn switch -c "$PUBLICATION_BRANCH"
          git -C barn commit -m "chore(registry): publish ${RELEASE_TAG}"

          remote_ref="refs/heads/${PUBLICATION_BRANCH}"
          tracking_ref="refs/remotes/origin/${PUBLICATION_BRANCH}"
          if git -C barn ls-remote \
            --exit-code \
            --heads \
            origin "$remote_ref" >/dev/null
          then
            git -C barn fetch origin "${remote_ref}:${tracking_ref}"
          fi

          git -C barn push \
            --force-with-lease \
            --set-upstream \
            origin "HEAD:${remote_ref}"

      - name: Create or reuse Barn pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLICATION_BRANCH: publish/contrib/${{ matrix.tag }}
          RELEASE_TAG: ${{ matrix.tag }}
          PR_BODY: >-
            Automated Barn publication for MontFerret/contrib tag
            `${{ matrix.tag }}`, prepared using Barn's public Go API.
            Merge after Barn CI and review pass.
        run: |
          existing_pr="$(
            gh pr list \
              --repo MontFerret/barn \
              --state open \
              --head "$PUBLICATION_BRANCH" \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "Updated existing pull request: $existing_pr"
            exit 0
          fi

          gh pr create \
            --repo MontFerret/barn \
            --base main \
            --head "$PUBLICATION_BRANCH" \
            --title "chore(registry): publish ${RELEASE_TAG}" \
            --body "$PR_BODY"

$schema: https://schemas.ferretlang.org/module/v1.json
name: montferret/xml
namespace: XML
version: 1.0.0-rc.15
description: XML parsing, traversal, decoding, streaming, and encoding helpers under XML for Ferret.
license: Apache-2.0
authors:
  - name: MontFerret Authors
documentation: https://github.com/MontFerret/contrib/tree/main/modules/xml/
repository:
  url: https://github.com/MontFerret/contrib
  directory: modules/xml
compatibility:
  ferret: ">=2.0.0-alpha.43 <3.0.0"
keywords:
  - xml
  - parsing
  - traversal
  - decoding
  - encoding
  - streaming
categories:
  - data-formats
  - serialization
exports:
  namespaces:
    - name: XML
      functions:
        - ROOT
        - TEXT
        - CHILDREN
        - ATTR
        - DECODE
        - DECODE_STREAM
        - ENCODE

$schema: https://schemas.ferretlang.org/module/v1.json
name: montferret/robots
namespace: WEB::ROBOTS
version: 1.0.0-rc.14
description: Robots.txt parsing and policy helpers under WEB::ROBOTS for Ferret.
license: Apache-2.0
authors:
  - name: MontFerret Authors
documentation: https://github.com/MontFerret/contrib/tree/main/modules/web/robots/
repository:
  url: https://github.com/MontFerret/contrib
  directory: modules/web/robots
compatibility:
  ferret: ">=2.0.0-alpha.43 <3.0.0"
keywords:
  - robots-txt
  - crawler-policy
  - user-agent
  - allow-disallow
  - sitemaps
categories:
  - web
  - web-crawling
exports:
  namespaces:
    - name: WEB::ROBOTS
      functions:
        - PARSE
        - ALLOWS
        - MATCH
        - SITEMAPS

$schema: https://schemas.ferretlang.org/module/v1.json
name: montferret/sitemap
namespace: WEB::SITEMAP
version: 1.0.0-rc.14
description: Sitemap discovery helpers under WEB::SITEMAP for Ferret.
license: Apache-2.0
authors:
  - name: MontFerret Authors
documentation: https://github.com/MontFerret/contrib/tree/main/modules/web/sitemap/
